databases:
  - name: studenthq-db
    plan: free
    databaseName: studenthq
    user: studenthq

services:
  - type: web
    name: studenthq
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn studenthq.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: studenthq-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_PASSWORD
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ENABLE_HTTPS
        value: "True"
      - key: WEB_CONCURRENCY
        value: "2"
