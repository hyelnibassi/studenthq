{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Student HQ | AUN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #001f3f 0%, #003d6b 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
        .signup-card { background: white; border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 520px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .logo-title { font-size: 1.8rem; font-weight: 800; color: #001f3f; text-align: center; margin-bottom: 0.25rem; }
        .logo-sub { color: #666; font-size: 0.9rem; text-align: center; margin-bottom: 1.5rem; }
        .divider { height: 3px; background: linear-gradient(90deg, #001f3f, #0066cc); border-radius: 2px; margin-bottom: 1.5rem; }
        .form-label { font-weight: 600; color: #001f3f; margin-bottom: 0.4rem; font-size: 0.95rem; }
        .form-control, .form-select { border: 1.5px solid #e0e0e0; border-radius: 8px; padding: 0.75rem 1rem; }
        .form-control:focus, .form-select:focus { border-color: #001f3f; box-shadow: 0 0 0 0.2rem rgba(0,31,63,0.15); }
        .btn-signup { background: linear-gradient(135deg, #001f3f, #0066cc); border: none; color: white; font-weight: 700; padding: 0.85rem; border-radius: 8px; width: 100%; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="signup-card">
        <div class="logo-title">Student HQ</div>
        <div class="logo-sub">American University of Nigeria — Create your account</div>
        <div class="divider"></div>
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    {{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
        <form method="POST" action="{% url 'signup' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" placeholder="e.g. Chidi Okeke" value="{{ form_data.name|default:'' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Student ID</label>
                <input type="text" name="student_id" class="form-control" placeholder="e.g. AUN-2026-001" value="{{ form_data.student_id|default:'' }}" required>
                <small class="text-muted">As issued by the AUN Registry</small>
            </div>
            <div class="mb-3">
                <label class="form-label">University Email</label>
                <input type="email" name="email" class="form-control" placeholder="yourname@aun.edu.ng" value="{{ form_data.email|default:'' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Program</label>
                <select name="program" class="form-select" required>
                    <option value="">— Select your program —</option>
                    {% for p in programs %}
                        <option value="{{ p }}" {% if form_data.program == p %}selected{% endif %}>{{ p }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Year Level</label>
                <select name="year_level" class="form-select" required>
                    <option value="1" {% if form_data.year_level == '1' %}selected{% endif %}>Year 1</option>
                    <option value="2" {% if form_data.year_level == '2' %}selected{% endif %}>Year 2</option>
                    <option value="3" {% if form_data.year_level == '3' %}selected{% endif %}>Year 3</option>
                    <option value="4" {% if form_data.year_level == '4' %}selected{% endif %}>Year 4</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password1" class="form-control" placeholder="Minimum 8 characters" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Confirm Password</label>
                <input type="password" name="password2" class="form-control" placeholder="Re-enter your password" required>
            </div>
            <button type="submit" class="btn btn-signup">Create Account</button>
        </form>
        <p class="text-center text-muted mt-3" style="font-size:0.9rem;">
            Already have an account? <a href="{% url 'login' %}" style="color:#001f3f; font-weight:600;">Sign in</a>
        </p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
